<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Wish Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0e14; color: #e2e8f0; font-family: sans-serif; }
    .gold-glow { box-shadow: 0 0 12px rgba(234, 179, 8, 0.6); }
    .purple-glow { box-shadow: 0 0 12px rgba(168, 85, 247, 0.6); }
    /* Estilo para la barra deslizante de últimos personajes */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ELEMENTS = ['Anemo', 'Geo', 'Electro', 'Dendro', 'Hydro', 'Pyro', 'Cryo'];
    const MONTHS = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    const ELEMENT_COLORS = {
      Anemo: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
      Geo: 'bg-amber-500/20 text-amber-300 border-amber-500/40',
      Electro: 'bg-purple-500/20 text-purple-300 border-purple-500/40',
      Dendro: 'bg-green-500/20 text-green-300 border-green-500/40',
      Hydro: 'bg-blue-500/20 text-blue-300 border-blue-500/40',
      Pyro: 'bg-red-500/20 text-red-300 border-red-500/40',
      Cryo: 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40'
    };

    const PRESET_CHARS = [
      { name: 'Raiden Shogun', rarity: 5, element: 'Electro', icon: 'https://api.iconify.design/gi:lightning-trio.svg' },
      { name: 'Furina', rarity: 5, element: 'Hydro', icon: 'https://api.iconify.design/gi:water-drop.svg' },
      { name: 'Nahida', rarity: 5, element: 'Dendro', icon: 'https://api.iconify.design/gi:clover.svg' },
      { name: 'Zhongli', rarity: 5, element: 'Geo', icon: 'https://api.iconify.design/gi:stone-block.svg' },
      { name: 'Kazuha', rarity: 5, element: 'Anemo', icon: 'https://api.iconify.design/gi:wind-hole.svg' },
      { name: 'Hu Tao', rarity: 5, element: 'Pyro', icon: 'https://api.iconify.design/gi:flame.svg' },
      { name: 'Neuvillette', rarity: 5, element: 'Hydro', icon: 'https://api.iconify.design/gi:water-drop.svg' }
    ];

    function App() {
      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('genshin_wishes_db');
        return saved ? JSON.parse(saved) : [];
      });

      const [selectedMonth, setSelectedMonth] = useState(10);
      const [selectedDay, setSelectedDay] = useState(null);
      const [activeTab, setActiveTab] = useState('calendar');

      const [filterElement, setFilterElement] = useState('Todos');
      const [filterRarity, setFilterRarity] = useState('Todas');

      // Form states
      const [formName, setFormName] = useState('');
      const [formRarity, setFormRarity] = useState(5);
      const [formElement, setFormElement] = useState('Anemo');
      const [formConstellation, setFormConstellation] = useState(0);
      const [formNotes, setFormNotes] = useState('');
      const [formDay, setFormDay] = useState(1);
      const [formMonth, setFormMonth] = useState(10);
      const [formYear, setFormYear] = useState(2026);
      const [formImage, setFormImage] = useState('');

      useEffect(() => {
        localStorage.setItem('genshin_wishes_db', JSON.stringify(records));
      }, [records]);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setFormImage(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleAddRecord = (e) => {
        e.preventDefault();
        if (!formName.trim()) return;

        const newEntry = {
          id: Date.now().toString(),
          name: formName,
          rarity: Number(formRarity),
          element: formElement,
          constellation: Number(formConstellation),
          notes: formNotes,
          day: Number(formDay),
          month: Number(formMonth),
          year: Number(formYear),
          image: formImage || 'https://api.iconify.design/gi:sparkles.svg'
        };

        setRecords(prev => [...prev, newEntry]);
        setFormName('');
        setFormNotes('');
        setFormImage('');
      };

      const handleDelete = (id) => {
        if (confirm('¿Seguro que deseas eliminar este registro?')) {
          setRecords(prev => prev.filter(r => r.id !== id));
        }
      };

      const openDayModal = (day) => {
        setSelectedDay(day);
        setFormDay(day);
        setFormMonth(selectedMonth);
      };

      const getRecordsForDay = (day) => {
        return records.filter(r => r.day === day && r.month === selectedMonth);
      };

      // Ordenar registros por fecha (Año -> Mes -> Día) Descendente
      const sortedRecords = [...records].sort((a, b) => {
        if (b.year !== a.year) return b.year - a.year;
        if (b.month !== a.month) return b.month - a.month;
        return b.day - a.day;
      });

      const filteredRecords = sortedRecords.filter(r => {
        const matchElement = filterElement === 'Todos' || r.element === filterElement;
        const matchRarity = filterRarity === 'Todas' || r.rarity === Number(filterRarity);
        return matchElement && matchRarity;
      });

      // Cálculo de mayor sequía con rango de fechas
      const calculateDrought = () => {
        if (records.length < 2) return null;
        const chronological = [...records].map(r => ({
          ...r,
          dateObj: new Date(r.year, r.month, r.day)
        })).sort((a, b) => a.dateObj - b.dateObj);

        let maxDiffDays = 0;
        let startDate = null;
        let endDate = null;

        for (let i = 0; i < chronological.length - 1; i++) {
          const current = chronological[i].dateObj;
          const next = chronological[i + 1].dateObj;
          const diffTime = next - current;
          const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

          if (diffDays > maxDiffDays) {
            maxDiffDays = diffDays;
            startDate = chronological[i];
            endDate = chronological[i + 1];
          }
        }
        return { maxDiffDays, startDate, endDate };
      };

      const droughtInfo = calculateDrought();

      // Mes con más suerte
      const monthCounts = {};
      records.forEach(r => { monthCounts[r.month] = (monthCounts[r.month] || 0) + 1; });
      let bestMonthIndex = null;
      let maxMonthCount = 0;
      Object.entries(monthCounts).forEach(([m, count]) => {
        if (count > maxMonthCount) { maxMonthCount = count; bestMonthIndex = Number(m); }
      });

      // Conteo por Año
      const yearCounts = {};
      records.forEach(r => { yearCounts[r.year] = (yearCounts[r.year] || 0) + 1; });

      // Conteo de Constelaciones
      const constCounts = {};
      records.forEach(r => {
        const c = r.constellation || 0;
        constCounts[c] = (constCounts[c] || 0) + 1;
      });

      return (
        <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto space-y-6">
          
          {/* BARRA SUPERIOR: Últimos Personajes Agregados */}
          <div className="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl shadow-lg">
            <div className="flex items-center justify-between mb-2">
              <span className="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2">
                <i className="fa-solid fa-clock-rotate-left"></i> Últimos Personajes Agregados
              </span>
              <span className="text-[10px] text-slate-500">Desliza para ver más ➔</span>
            </div>
            
            {sortedRecords.length === 0 ? (
              <p className="text-xs text-slate-500 italic py-1">Aún no hay personajes registrados en el sistema.</p>
            ) : (
              <div className="flex gap-3 overflow-x-auto hide-scrollbar pb-1">
                {sortedRecords.slice(0, 10).map(rec => (
                  <div 
                    key={rec.id}
                    className="flex items-center gap-2.5 bg-slate-950 border border-slate-800 px-3 py-2 rounded-xl whitespace-nowrap shrink-0"
                  >
                    <img src={rec.image} className="w-8 h-8 rounded-lg object-cover bg-slate-900 border border-slate-700" />
                    <div>
                      <p className="text-xs font-bold text-slate-200">{rec.name} <span className={rec.rarity === 5 ? 'text-amber-400' : 'text-purple-400'}>{rec.rarity}★</span></p>
                      <p className="text-[10px] text-amber-400/80 font-medium">{rec.day} de {MONTHS[rec.month]} de {rec.year}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Header Principal */}
          <header className="flex flex-col md:flex-row items-center justify-between gap-4 bg-slate-900/80 p-6 rounded-2xl border border-slate-800">
            <div className="flex items-center gap-3">
              <i className="fa-solid fa-calendar-star text-amber-400 text-3xl"></i>
              <div>
                <h1 className="text-2xl font-bold bg-gradient-to-r from-amber-200 to-amber-500 bg-clip-text text-transparent">
                  Genshin Wish Tracker
                </h1>
                <p className="text-sm text-slate-400">Histórico de Personajes Obtenidos</p>
              </div>
            </div>

            <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
              <button 
                onClick={() => setActiveTab('calendar')}
                className={`px-5 py-2 rounded-lg font-medium text-sm transition ${activeTab === 'calendar' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'}`}
              >
                <i className="fa-solid fa-calendar-days mr-2"></i>Calendario
              </button>
              <button 
                onClick={() => setActiveTab('stats')}
                className={`px-5 py-2 rounded-lg font-medium text-sm transition ${activeTab === 'stats' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'}`}
              >
                <i className="fa-solid fa-chart-pie mr-2"></i>Histórico & Stats
              </button>
            </div>
          </header>

          {/* Tab: Calendar */}
          {activeTab === 'calendar' && (
            <main className="space-y-4">
              <div className="flex items-center justify-between bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                <button 
                  onClick={() => setSelectedMonth(prev => (prev === 0 ? 11 : prev - 1))}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-medium"
                >
                  <i className="fa-solid fa-chevron-left mr-1"></i> Anterior
                </button>
                <h2 className="text-xl font-bold text-amber-300">
                  {MONTHS[selectedMonth]} <span className="text-xs text-slate-400 font-normal">(Todos los años)</span>
                </h2>
                <button 
                  onClick={() => setSelectedMonth(prev => (prev === 11 ? 0 : prev + 1))}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-medium"
                >
                  Siguiente <i className="fa-solid fa-chevron-right ml-1"></i>
                </button>
              </div>

              {/* Grilla Calendario */}
              <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-3">
                {Array.from({ length: 31 }, (_, i) => i + 1).map(day => {
                  const dayRecords = getRecordsForDay(day);
                  return (
                    <div 
                      key={day}
                      onClick={() => openDayModal(day)}
                      className="bg-slate-900/40 hover:bg-slate-800/60 border border-slate-800 hover:border-amber-500/50 rounded-xl p-3 min-h-[140px] cursor-pointer transition flex flex-col justify-between"
                    >
                      <div className="flex justify-between items-center text-xs font-bold text-slate-400 mb-2">
                        <span className="text-sm text-slate-300">Día {day}</span>
                        {dayRecords.length > 0 && (
                          <span className="bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full text-[10px]">
                            {dayRecords.length}
                          </span>
                        )}
                      </div>

                      <div className="flex flex-wrap gap-2 items-center justify-center py-1">
                        {dayRecords.map(rec => (
                          <div 
                            key={rec.id}
                            className={`relative w-14 h-14 rounded-xl overflow-hidden border-2 transition transform hover:scale-110 ${rec.rarity === 5 ? 'border-amber-400 gold-glow' : 'border-purple-400 purple-glow'}`}
                            title={`${rec.name} (${rec.element} - ${rec.year})`}
                          >
                            <img src={rec.image} alt={rec.name} className="w-full h-full object-cover" />
                            <span className="absolute bottom-0 right-0 bg-slate-950/90 text-[9px] px-1 font-bold text-amber-300">
                              '{rec.year.toString().slice(-2)}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>
          )}

          {/* Tab: Stats & Full List */}
          {activeTab === 'stats' && (
            <main className="space-y-6">
              {/* Tarjetas Principales */}
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                <div className="bg-slate-900/60 border border-slate-800 p-5 rounded-xl text-center">
                  <p className="text-slate-400 text-xs uppercase font-bold mb-1">Total Registrados</p>
                  <p className="text-3xl font-extrabold text-amber-400">{records.length}</p>
                </div>
                <div className="bg-slate-900/60 border border-slate-800 p-5 rounded-xl text-center">
                  <p className="text-slate-400 text-xs uppercase font-bold mb-1">Personajes 5★</p>
                  <p className="text-3xl font-extrabold text-amber-300">
                    {records.filter(r => r.rarity === 5).length}
                  </p>
                </div>
                <div className="bg-slate-900/60 border border-slate-800 p-5 rounded-xl text-center">
                  <p className="text-slate-400 text-xs uppercase font-bold mb-1">Personajes 4★</p>
                  <p className="text-3xl font-extrabold text-purple-400">
                    {records.filter(r => r.rarity === 4).length}
                  </p>
                </div>
                <div className="bg-slate-900/60 border border-slate-800 p-5 rounded-xl text-center">
                  <p className="text-slate-400 text-xs uppercase font-bold mb-1">Mes con Más Suerte</p>
                  <p className="text-lg font-bold text-amber-400">
                    {bestMonthIndex !== null ? MONTHS[bestMonthIndex] : 'N/A'}
                  </p>
                  {bestMonthIndex !== null && (
                    <p className="text-[10px] text-slate-400">{maxMonthCount} obtenidos en total</p>
                  )}
                </div>
              </div>

              {/* Récord de Sequía con Rango Exacto */}
              {droughtInfo && droughtInfo.maxDiffDays > 0 && (
                <div className="bg-slate-900/80 border border-amber-500/30 p-5 rounded-xl flex flex-col md:flex-row items-center justify-between gap-4">
                  <div className="flex items-center gap-4">
                    <div className="w-12 h-12 rounded-full bg-amber-500/20 flex items-center justify-center text-amber-400 text-xl font-bold">
                      <i className="fa-solid fa-hourglass-half"></i>
                    </div>
                    <div>
                      <h4 className="text-sm font-bold text-slate-300 uppercase">Mayor Racha de Sequía</h4>
                      <p className="text-2xl font-extrabold text-amber-400">
                        {droughtInfo.maxDiffDays} días sin personajes
                      </p>
                    </div>
                  </div>
                  <div className="text-right border-t md:border-t-0 md:border-l border-slate-800 pt-3 md:pt-0 md:pl-6">
                    <p className="text-xs text-slate-400">Rango de Fechas Exacto:</p>
                    <p className="text-sm font-semibold text-slate-200">
                      Del {droughtInfo.startDate.day} de {MONTHS[droughtInfo.startDate.month]} de {droughtInfo.startDate.year} 
                      <span className="text-amber-400 mx-2 font-bold">➔</span> 
                      al {droughtInfo.endDate.day} de {MONTHS[droughtInfo.endDate.month]} de {droughtInfo.endDate.year}
                    </p>
                  </div>
                </div>
              )}

              {/* Métricas Avanzadas: Distribución por Elemento, Años y Constelaciones */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                {/* 1. Distribución por Elementos */}
                <div className="bg-slate-900/60 border border-slate-800 p-5 rounded-xl space-y-3">
                  <h4 className="text-sm font-bold text-amber-300 uppercase mb-2">Distribución por Elementos</h4>
                  {ELEMENTS.map(el => {
                    const count = records.filter(r => r.element === el).length;
                    const pct = records.length > 0 ? ((count / records.length) * 100).toFixed(0) : 0;
                    return (
                      <div key={el} className="space-y-1">
                        <div className="flex justify-between text-xs font-semibold">
                          <span className="text-slate-300">{el}</span>
                          <span className="text-slate-400">{count} ({pct}%)</span>
                        </div>
                        <div className="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                          <div className="bg-amber-400 h-full rounded-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* 2. Obtenciones por Año */}
                <div className="bg-slate-900/60 border border-slate-800 p-5 rounded-xl space-y-3">
                  <h4 className="text-sm font-bold text-amber-300 uppercase mb-2">Personajes por Año</h4>
                  {Object.keys(yearCounts).length === 0 ? (
                    <p className="text-xs text-slate-500 italic">No hay datos suficientes aún.</p>
                  ) : (
                    Object.entries(yearCounts).sort((a,b) => b[0] - a[0]).map(([yr, count]) => (
                      <div key={yr} className="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
                        <span className="font-bold text-amber-300 text-sm">Año {yr}</span>
                        <span className="bg-amber-500/20 text-amber-400 px-3 py-1 rounded-full text-xs font-bold">
                          {count} obtenidos
                        </span>
                      </div>
                    ))
                  )}
                </div>

                {/* 3. Nivel de Constelaciones */}
                <div className="bg-slate-900/60 border border-slate-800 p-5 rounded-xl space-y-3">
                  <h4 className="text-sm font-bold text-amber-300 uppercase mb-2">Nivel de Constelaciones</h4>
                  {Object.keys(constCounts).length === 0 ? (
                    <p className="text-xs text-slate-500 italic">No hay constelaciones registradas.</p>
                  ) : (
                    Object.entries(constCounts).sort((a,b) => a[0] - b[0]).map(([c, count]) => (
                      <div key={c} className="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
                        <span className="font-bold text-purple-300 text-sm">Constelación C{c}</span>
                        <span className="bg-purple-500/20 text-purple-400 px-3 py-1 rounded-full text-xs font-bold">
                          {count} personajes
                        </span>
                      </div>
                    ))
                  )}
                </div>

              </div>

              {/* Filtros de Búsqueda y Histórico Completo */}
              <div className="bg-slate-900/60 border border-slate-800 p-5 rounded-xl space-y-4">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                  <h3 className="text-lg font-bold text-amber-300">Histórico de Personajes Guardados</h3>
                  
                  <div className="flex flex-wrap gap-2">
                    <select 
                      value={filterElement} 
                      onChange={e => setFilterElement(e.target.value)}
                      className="bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-lg px-3 py-2 font-medium"
                    >
                      <option value="Todos">Todos los Elementos</option>
                      {ELEMENTS.map(el => <option key={el} value={el}>{el}</option>)}
                    </select>

                    <select 
                      value={filterRarity} 
                      onChange={e => setFilterRarity(e.target.value)}
                      className="bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-lg px-3 py-2 font-medium"
                    >
                      <option value="Todas">Todas las Rarezas</option>
                      <option value="5">5 Estrellas (5★)</option>
                      <option value="4">4 Estrellas (4★)</option>
                    </select>
                  </div>
                </div>

                {filteredRecords.length === 0 ? (
                  <p className="text-slate-500 text-sm text-center py-8">No se encontraron registros con esos filtros.</p>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    {filteredRecords.map(rec => (
                      <div 
                        key={rec.id}
                        className={`p-4 rounded-xl border bg-slate-950 flex items-center gap-3 relative ${rec.rarity === 5 ? 'border-amber-500/50 gold-glow' : 'border-purple-500/50 purple-glow'}`}
                      >
                        <img src={rec.image} className="w-14 h-14 rounded-xl object-cover bg-slate-800 border border-slate-700" />
                        <div className="flex-1 min-w-0">
                          <p className="font-bold text-sm truncate">{rec.name}</p>
                          <div className="flex items-center gap-2 mt-0.5">
                            <span className={`text-[10px] px-2 py-0.5 rounded-md border font-semibold ${ELEMENT_COLORS[rec.element] || 'bg-slate-800 text-slate-300'}`}>
                              {rec.element}
                            </span>
                            <span className={`text-xs font-bold ${rec.rarity === 5 ? 'text-amber-400' : 'text-purple-400'}`}>
                              {rec.rarity}★
                            </span>
                            {rec.constellation > 0 && (
                              <span className="text-[10px] bg-slate-800 text-amber-300 px-1.5 py-0.5 rounded font-bold">
                                C{rec.constellation}
                              </span>
                            )}
                          </div>
                          <p className="text-[10px] text-amber-400/90 font-medium mt-1.5">
                            {rec.day} de {MONTHS[rec.month]} de {rec.year}
                          </p>
                        </div>
                        <button onClick={() => handleDelete(rec.id)} className="text-slate-500 hover:text-red-400 text-xs p-1">
                          <i className="fa-solid fa-trash"></i>
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </main>
          )}

          {/* Modal del Día */}
          {selectedDay !== null && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl p-6 space-y-6 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                  <h3 className="text-lg font-bold text-amber-300">
                    Historial del {selectedDay} de {MONTHS[selectedMonth]}
                  </h3>
                  <button onClick={() => setSelectedDay(null)} className="text-slate-400 hover:text-white">
                    <i className="fa-solid fa-xmark text-xl"></i>
                  </button>
                </div>

                <form onSubmit={handleAddRecord} className="space-y-4 bg-slate-950/60 p-4 rounded-xl border border-slate-800">
                  <h4 className="text-sm font-bold text-amber-400">Nuevo Registro</h4>

                  <div className="flex gap-2 overflow-x-auto pb-2">
                    {PRESET_CHARS.map(p => (
                      <button
                        key={p.name}
                        type="button"
                        onClick={() => {
                          setFormName(p.name);
                          setFormRarity(p.rarity);
                          setFormElement(p.element);
                          setFormImage(p.icon);
                        }}
                        className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg whitespace-nowrap border border-slate-700 font-medium"
                      >
                        <img src={p.icon} className="w-4 h-4" />
                        {p.name}
                      </button>
                    ))}
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-[10px] text-slate-400 font-bold block mb-1">Día</label>
                      <input type="number" value={formDay} onChange={e => setFormDay(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-center w-full" min="1" max="31"/>
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-400 font-bold block mb-1">Mes</label>
                      <select value={formMonth} onChange={e => setFormMonth(Number(e.target.value))} className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs w-full">
                        {MONTHS.map((m, idx) => <option key={m} value={idx}>{m}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-400 font-bold block mb-1">Año</label>
                      <select value={formYear} onChange={e => setFormYear(Number(e.target.value))} className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs w-full">
                        {[2020, 2021, 2022, 2023, 2024, 2025, 2026, 2027].map(y => <option key={y} value={y}>{y}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-2">
                    <div className="sm:col-span-1">
                      <label className="text-[10px] text-slate-400 font-bold block mb-1">Nombre</label>
                      <input type="text" placeholder="Ej: Kazuha" value={formName} onChange={e => setFormName(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs w-full" required/>
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-400 font-bold block mb-1">Rareza</label>
                      <select value={formRarity} onChange={e => setFormRarity(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs w-full">
                        <option value={5}>5 Estrellas</option>
                        <option value={4}>4 Estrellas</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-[10px] text-amber-400 font-bold block mb-1">Elemento</label>
                      <select value={formElement} onChange={e => setFormElement(e.target.value)} className="bg-slate-900 border border-amber-500/50 rounded-lg p-2.5 text-xs font-semibold w-full text-amber-300">
                        {ELEMENTS.map(el => <option key={el} value={el}>{el}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-400 font-bold block mb-1">Constelación</label>
                      <select value={formConstellation} onChange={e => setFormConstellation(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs w-full">
                        <option value={0}>C0 (Base)</option>
                        <option value={1}>C1</option>
                        <option value={2}>C2</option>
                        <option value={3}>C3</option>
                        <option value={4}>C4</option>
                        <option value={5}>C5</option>
                        <option value={6}>C6</option>
                      </select>
                    </div>
                  </div>

                  <div className="flex items-center gap-3 pt-2">
                    <div className="w-12 h-12 bg-slate-900 border border-slate-800 rounded-lg overflow-hidden flex items-center justify-center">
                      {formImage ? <img src={formImage} className="w-full h-full object-cover" /> : <i className="fa-solid fa-image text-slate-600"></i>}
                    </div>
                    <label className="flex-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg p-3 text-xs text-center cursor-pointer font-medium">
                      <i className="fa-solid fa-upload mr-2 text-amber-400"></i>Subir Imagen PC
                      <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                    </label>
                  </div>

                  <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-lg text-xs transition uppercase tracking-wider">
                    Registrar Personaje
                  </button>
                </form>

                <div className="space-y-3">
                  <h4 className="text-xs font-bold uppercase text-slate-400">Obtenidos en esta fecha:</h4>
                  {getRecordsForDay(selectedDay).length === 0 ? (
                    <p className="text-xs text-slate-500 italic">No hay registros guardados para el {selectedDay} de {MONTHS[selectedMonth]}.</p>
                  ) : (
                    <div className="space-y-2">
                      {getRecordsForDay(selectedDay).map(rec => (
                        <div key={rec.id} className="flex items-center justify-between p-3 bg-slate-950 rounded-xl border border-slate-800">
                          <div className="flex items-center gap-3">
                            <img src={rec.image} className="w-12 h-12 rounded-xl object-cover bg-slate-800" />
                            <div>
                              <p className="text-xs font-bold">{rec.name} <span className="text-amber-400 font-normal">({rec.year})</span></p>
                              <p className="text-[10px] text-slate-400">{rec.element} • {rec.rarity}★ {rec.constellation > 0 && `• C${rec.constellation}`}</p>
                            </div>
                          </div>
                          <button onClick={() => handleDelete(rec.id)} className="text-slate-500 hover:text-red-400 text-xs p-1">
                            <i className="fa-solid fa-trash"></i>
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
