<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin 5★ Wish Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0e14; color: #e2e8f0; font-family: sans-serif; background-size: cover; background-position: center; background-attachment: fixed; }
    .gold-glow { box-shadow: 0 0 14px rgba(234, 179, 8, 0.7); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ELEMENTS = ['Anemo', 'Geo', 'Electro', 'Dendro', 'Hydro', 'Pyro', 'Cryo'];
    const MONTHS = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    const ELEMENT_COLORS = {
      Anemo: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
      Geo: 'bg-amber-500/20 text-amber-300 border-amber-500/40',
      Electro: 'bg-purple-500/20 text-purple-300 border-purple-500/40',
      Dendro: 'bg-green-500/20 text-green-300 border-green-500/40',
      Hydro: 'bg-blue-500/20 text-blue-300 border-blue-500/40',
      Pyro: 'bg-red-500/20 text-red-300 border-red-500/40',
      Cryo: 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40'
    };

    function App() {
      const [records, setRecords] = useState(() => {
        try {
          const saved = localStorage.getItem('genshin_wishes_db');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const [bgImage, setBgImage] = useState(() => {
        return localStorage.getItem('genshin_bg_url') || '';
      });

      const [selectedMonth, setSelectedMonth] = useState(10);
      const [selectedDay, setSelectedDay] = useState(null);
      const [activeTab, setActiveTab] = useState('calendar');
      const [filterElement, setFilterElement] = useState('Todos');

      const [editingId, setEditingId] = useState(null);
      const [formName, setFormName] = useState('');
      const [formElement, setFormElement] = useState('Anemo');
      const [formConstellation, setFormConstellation] = useState(0);
      const [formYear, setFormYear] = useState(2026);
      const [formImage, setFormImage] = useState('');

      useEffect(() => {
        try {
          localStorage.setItem('genshin_wishes_db', JSON.stringify(records));
        } catch (e) {
          alert("Almacenamiento local lleno.");
        }
      }, [records]);

      useEffect(() => {
        localStorage.setItem('genshin_bg_url', bgImage);
        if (bgImage) {
          document.body.style.backgroundImage = `linear-gradient(rgba(11, 14, 20, 0.85), rgba(11, 14, 20, 0.85)), url('${bgImage}')`;
        } else {
          document.body.style.backgroundImage = 'none';
        }
      }, [bgImage]);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setFormImage(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleSaveRecord = (e) => {
        e.preventDefault();
        if (!formName.trim() || selectedDay === null) return;

        if (editingId) {
          setRecords(prev => prev.map(r => r.id === editingId ? {
            ...r,
            name: formName,
            rarity: 5,
            element: formElement,
            constellation: Number(formConstellation),
            year: Number(formYear),
            image: formImage || r.image
          } : r));
          setEditingId(null);
        } else {
          const newEntry = {
            id: Date.now().toString(),
            name: formName,
            rarity: 5,
            element: formElement,
            constellation: Number(formConstellation),
            day: Number(selectedDay),
            month: Number(selectedMonth),
            year: Number(formYear),
            image: formImage || 'https://api.iconify.design/gi:sparkles.svg'
          };
          setRecords(prev => [...prev, newEntry]);
        }

        setFormName('');
        setFormImage('');
        setFormConstellation(0);
        setSelectedDay(null);
      };

      const handleEditClick = (rec) => {
        setEditingId(rec.id);
        setFormName(rec.name);
        setFormElement(rec.element);
        setFormConstellation(rec.constellation || 0);
        setFormYear(rec.year);
        setFormImage(rec.image);
      };

      const handleDelete = (id) => {
        if (confirm('¿Seguro que deseas eliminar este registro?')) {
          setRecords(prev => prev.filter(r => r.id !== id));
          if (editingId === id) setEditingId(null);
        }
      };

      const openDayModal = (day) => {
        setSelectedDay(day);
        setEditingId(null);
        setFormName('');
        setFormImage('');
        setFormConstellation(0);
      };

      const getRecordsForDay = (day) => {
        return records.filter(r => r.day === day && r.month === selectedMonth);
      };

      const sortedRecords = [...records].sort((a, b) => {
        if (b.year !== a.year) return b.year - a.year;
        if (b.month !== a.month) return b.month - a.month;
        return b.day - a.day;
      });

      const filteredRecords = sortedRecords.filter(r => {
        return filterElement === 'Todos' || r.element === filterElement;
      });

      return (
        <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto space-y-6">
          <header className="flex flex-col md:flex-row items-center justify-between gap-4 bg-slate-900/80 backdrop-blur-md p-6 rounded-2xl border border-slate-800">
            <div className="flex items-center gap-3">
              <i className="fa-solid fa-calendar-star text-amber-400 text-3xl"></i>
              <div>
                <h1 className="text-2xl font-bold bg-gradient-to-r from-amber-200 to-amber-500 bg-clip-text text-transparent">
                  Genshin 5★ Wish Tracker
                </h1>
                <p className="text-sm text-slate-400">Histórico exclusivo de Personajes 5 Estrellas</p>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              <button 
                onClick={() => {
                  const url = prompt('Ingresa la URL de la imagen de fondo:', bgImage);
                  if (url !== null) setBgImage(url);
                }}
                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold border border-slate-700 transition"
              >
                <i className="fa-solid fa-image mr-1 text-amber-400"></i> Fondo
              </button>

              <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button 
                  onClick={() => setActiveTab('calendar')}
                  className={`px-5 py-2 rounded-lg font-medium text-sm transition ${activeTab === 'calendar' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  <i className="fa-solid fa-calendar-days mr-2"></i>Calendario
                </button>
                <button 
                  onClick={() => setActiveTab('stats')}
                  className={`px-5 py-2 rounded-lg font-medium text-sm transition ${activeTab === 'stats' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  <i className="fa-solid fa-chart-pie mr-2"></i>Histórico & Stats
                </button>
              </div>
            </div>
          </header>

          <div className="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl shadow-lg backdrop-blur-md">
            <div className="flex items-center justify-between mb-2">
              <span className="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2">
                <i className="fa-solid fa-clock-rotate-left"></i> Últimos 5★ Agregados
              </span>
            </div>
            {sortedRecords.length === 0 ? (
              <p className="text-xs text-slate-500 italic py-1">Aún no hay personajes 5★ registrados.</p>
            ) : (
              <div className="flex gap-3 overflow-x-auto hide-scrollbar pb-1">
                {sortedRecords.slice(0, 10).map(rec => (
                  <div key={rec.id} className="flex items-center gap-2.5 bg-slate-950 border border-amber-500/40 px-3 py-2 rounded-xl whitespace-nowrap shrink-0 gold-glow">
                    <img src={rec.image} className="w-8 h-8 rounded-lg object-cover bg-slate-900 border border-amber-500" />
                    <div>
                      <p className="text-xs font-bold text-slate-200">
                        {rec.name} <span className="text-amber-400">5★</span>
                        {rec.constellation > 0 && <span className="text-purple-300 ml-1">C{rec.constellation}</span>}
                      </p>
                      <p className="text-[10px] text-amber-400/80 font-medium">{rec.day} de {MONTHS[rec.month]} de {rec.year}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {activeTab === 'calendar' && (
            <main className="space-y-4">
              <div className="flex items-center justify-between bg-slate-900/60 backdrop-blur-md p-4 rounded-xl border border-slate-800">
                <button onClick={() => setSelectedMonth(prev => (prev === 0 ? 11 : prev - 1))} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-medium">
                  <i className="fa-solid fa-chevron-left mr-1"></i> Anterior
                </button>
                <h2 className="text-xl font-bold text-amber-300">
                  {MONTHS[selectedMonth]} <span className="text-xs text-slate-400 font-normal">(Todos los años)</span>
                </h2>
                <button onClick={() => setSelectedMonth(prev => (prev === 11 ? 0 : prev + 1))} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-medium">
                  Siguiente <i className="fa-solid fa-chevron-right ml-1"></i>
                </button>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-3">
                {Array.from({ length: 31 }, (_, i) => i + 1).map(day => {
                  const dayRecords = getRecordsForDay(day);
                  return (
                    <div key={day} onClick={() => openDayModal(day)} className="bg-slate-900/50 hover:bg-slate-800/80 backdrop-blur-md border border-slate-800 hover:border-amber-500/50 rounded-xl p-3 min-h-[140px] cursor-pointer transition flex flex-col justify-between">
                      <div className="flex justify-between items-center text-xs font-bold text-slate-400 mb-2">
                        <span className="text-sm text-slate-300">Día {day}</span>
                        {dayRecords.length > 0 && (
                          <span className="bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full text-[10px]">{dayRecords.length}</span>
                        )}
                      </div>
                      <div className="flex flex-wrap gap-2 items-center justify-center py-1">
                        {dayRecords.map(rec => (
                          <div key={rec.id} className="relative w-14 h-14 rounded-xl overflow-hidden border-2 border-amber-400 gold-glow transition transform hover:scale-110">
                            <img src={rec.image} alt={rec.name} className="w-full h-full object-cover" />
                            <div className="absolute bottom-0 inset-x-0 bg-slate-950/80 flex justify-between px-1 text-[9px] font-bold">
                              <span className="text-amber-300">'{rec.year.toString().slice(-2)}</span>
                              {rec.constellation > 0 && <span className="text-purple-300">C{rec.constellation}</span>}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>
          )}

          {activeTab === 'stats' && (
            <main className="space-y-6">
              <div className="bg-slate-900/60 border border-slate-800 p-5 rounded-xl space-y-4">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                  <h3 className="text-lg font-bold text-amber-300">Histórico de 5 Estrellas Guardados ({records.length} total)</h3>
                  <select value={filterElement} onChange={e => setFilterElement(e.target.value)} className="bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-lg px-3 py-2 font-medium">
                    <option value="Todos">Todos los Elementos</option>
                    {ELEMENTS.map(el => <option key={el} value={el}>{el}</option>)}
                  </select>
                </div>

                {filteredRecords.length === 0 ? (
                  <p className="text-slate-500 text-sm text-center py-8">No se encontraron registros.</p>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    {filteredRecords.map(rec => (
                      <div key={rec.id} className="p-4 rounded-xl border bg-slate-950 flex items-center gap-3 relative border-amber-500/60 gold-glow">
                        <img src={rec.image} className="w-14 h-14 rounded-xl object-cover bg-slate-800 border border-amber-500" />
                        <div className="flex-1 min-w-0">
                          <p className="font-bold text-sm truncate">{rec.name}</p>
                          <div className="flex items-center gap-2 mt-0.5">
                            <span className={`text-[10px] px-2 py-0.5 rounded-md border font-semibold ${ELEMENT_COLORS[rec.element] || 'bg-slate-800 text-slate-300'}`}>{rec.element}</span>
                            <span className="text-xs font-bold text-amber-400">5★</span>
                            {rec.constellation > 0 && <span className="text-[10px] bg-purple-500/20 text-purple-300 border border-purple-500/40 px-1.5 py-0.5 rounded font-bold ml-1">C{rec.constellation}</span>}
                          </div>
                          <p className="text-[10px] text-amber-400/80 font-medium mt-1.5">{rec.day} de {MONTHS[rec.month]} de {rec.year}</p>
                        </div>
                        <div className="flex flex-col gap-1">
                          <button onClick={() => { setSelectedDay(rec.day); setSelectedMonth(rec.month); handleEditClick(rec); }} className="text-slate-400 hover:text-amber-300 text-xs p-1"><i className="fa-solid fa-pen"></i></button>
                          <button onClick={() => handleDelete(rec.id)} className="text-slate-500 hover:text-red-400 text-xs p-1"><i className="fa-solid fa-trash"></i></button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </main>
          )}

          {selectedDay !== null && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl p-6 space-y-6 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                  <h3 className="text-lg font-bold text-amber-300">Historial del {selectedDay} de {MONTHS[selectedMonth]} (5 Estrellas)</h3>
                  <button onClick={() => { setSelectedDay(null); setEditingId(null); }} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-xl"></i></button>
                </div>

                <form onSubmit={handleSaveRecord} className="space-y-4 bg-slate-950/60 p-4 rounded-xl border border-slate-800">
                  <div className="flex justify-between items-center">
                    <h4 className="text-sm font-bold text-amber-400">{editingId ? 'Editar Personaje 5★' : 'Nuevo Personaje 5★'}</h4>
                    {editingId && <button type="button" onClick={() => { setEditingId(null); setFormName(''); setFormImage(''); setFormConstellation(0); }} className="text-xs text-slate-400 hover:text-white underline">Cancelar</button>}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="text-[10px] text-slate-400 font-bold block mb-1">Año</label>
                      <select value={formYear} onChange={e => setFormYear(Number(e.target.value))} className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs w-full">
                        {[2020, 2021, 2022, 2023, 2024, 2025, 2026, 2027].map(y => <option key={y} value={y}>{y}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-400 font-bold block mb-1">Nombre</label>
                      <input type="text" placeholder="Ej: Furina" value={formName} onChange={e => setFormName(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs w-full" required/>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="text-[10px] text-amber-400 font-bold block mb-1">Elemento</label>
                      <select value={formElement} onChange={e => setFormElement(e.target.value)} className="bg-slate-900 border border-amber-500/50 rounded-lg p-2.5 text-xs font-semibold w-full text-amber-300">
                        {ELEMENTS.map(el => <option key={el} value={el}>{el}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-[10px] text-purple-400 font-bold block mb-1">Constelación</label>
                      <select value={formConstellation} onChange={e => setFormConstellation(e.target.value)} className="bg-slate-900 border border-purple-500/50 rounded-lg p-2.5 text-xs font-semibold w-full text-purple-300">
                        <option value={0}>C0 (Base)</option>
                        <option value={1}>C1</option><option value={2}>C2</option><option value={3}>C3</option><option value={4}>C4</option><option value={5}>C5</option><option value={6}>C6</option>
                      </select>
                    </div>
                  </div>

                  <div className="flex items-center gap-3 pt-1">
                    <div className="w-12 h-12 bg-slate-900 border border-slate-800 rounded-lg overflow-hidden flex items-center justify-center">
                      {formImage ? <img src={formImage} className="w-full h-full object-cover" /> : <i className="fa-solid fa-image text-slate-600"></i>}
                    </div>
                    <label className="flex-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg p-3 text-xs text-center cursor-pointer font-medium">
                      <i className="fa-solid fa-upload mr-2 text-amber-400"></i>Subir Imagen PC
                      <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                    </label>
                  </div>

                  <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-lg text-xs transition uppercase tracking-wider">
                    {editingId ? 'Actualizar 5★' : 'Registrar 5★'}
                  </button>
                </form>

                <div className="space-y-3">
                  <h4 className="text-xs font-bold uppercase text-slate-400">5 Estrellas en esta fecha:</h4>
                  {getRecordsForDay(selectedDay).length === 0 ? (
                    <p className="text-xs text-slate-500 italic">No hay registros.</p>
                  ) : (
                    <div className="space-y-2">
                      {getRecordsForDay(selectedDay).map(rec => (
                        <div key={rec.id} className="flex items-center justify-between p-3 bg-slate-950 rounded-xl border border-slate-800">
                          <div className="flex items-center gap-3">
                            <img src={rec.image} className="w-12 h-12 rounded-xl object-cover bg-slate-800 border border-amber-500" />
                            <div>
                              <p className="text-xs font-bold">{rec.name} <span className="text-amber-400 font-normal">({rec.year})</span></p>
                              <p className="text-[10px] text-slate-400">{rec.element} • <span className="text-amber-400 font-bold">5★</span> • C{rec.constellation || 0}</p>
                            </div>
                          </div>
                          <div className="flex items-center gap-2">
                            <button onClick={() => handleEditClick(rec)} className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-2.5 py-1.5 rounded-lg"><i className="fa-solid fa-pen"></i></button>
                            <button onClick={() => handleDelete(rec.id)} className="bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs px-2.5 py-1.5 rounded-lg"><i className="fa-solid fa-trash"></i></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
