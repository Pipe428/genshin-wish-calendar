<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Wish Tracker Calendar</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }
    .gold-border { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
    .purple-border { border-color: #a855f7; box-shadow: 0 0 10px rgba(168, 85, 247, 0.3); }
  </style>
</head>
<body class="selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const ELEMENTS = [
      { name: 'Pyro', color: 'text-red-400', bg: 'bg-red-500/20', border: 'border-red-500/50', icon: 'fa-fire' },
      { name: 'Hydro', color: 'text-blue-400', bg: 'bg-blue-500/20', border: 'border-blue-500/50', icon: 'fa-droplet' },
      { name: 'Anemo', color: 'text-emerald-400', bg: 'bg-emerald-500/20', border: 'border-emerald-500/50', icon: 'fa-wind' },
      { name: 'Electro', color: 'text-purple-400', bg: 'bg-purple-500/20', border: 'border-purple-500/50', icon: 'fa-bolt' },
      { name: 'Dendro', color: 'text-lime-400', bg: 'bg-lime-500/20', border: 'border-lime-500/50', icon: 'fa-leaf' },
      { name: 'Cryo', color: 'text-cyan-400', bg: 'bg-cyan-500/20', border: 'border-cyan-500/50', icon: 'fa-snowflake' },
      { name: 'Geo', color: 'text-amber-400', bg: 'bg-amber-500/20', border: 'border-amber-500/50', icon: 'fa-mountain' },
    ];

    const MONTHS = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    const PRESET_CHARS = [
      { name: 'Raiden Shogun', rarity: 5, element: 'Electro', icon: 'https://images.api-genshin.dev/characters/raiden/icon.png' },
      { name: 'Furina', rarity: 5, element: 'Hydro', icon: 'https://images.api-genshin.dev/characters/furina/icon.png' },
      { name: 'Nahida', rarity: 5, element: 'Dendro', icon: 'https://images.api-genshin.dev/characters/nahida/icon.png' },
      { name: 'Zhongli', rarity: 5, element: 'Geo', icon: 'https://images.api-genshin.dev/characters/zhongli/icon.png' },
      { name: 'Kazuha', rarity: 5, element: 'Anemo', icon: 'https://images.api-genshin.dev/characters/kazuha/icon.png' },
      { name: 'Hu Tao', rarity: 5, element: 'Pyro', icon: 'https://images.api-genshin.dev/characters/hu-tao/icon.png' },
      { name: 'Neuvillette', rarity: 5, element: 'Hydro', icon: 'https://images.api-genshin.dev/characters/neuvillette/icon.png' },
      { name: 'Bennett', rarity: 4, element: 'Pyro', icon: 'https://images.api-genshin.dev/characters/bennett/icon.png' },
      { name: 'Xingqiu', rarity: 4, element: 'Hydro', icon: 'https://images.api-genshin.dev/characters/xingqiu/icon.png' },
      { name: 'Xiangling', rarity: 4, element: 'Pyro', icon: 'https://images.api-genshin.dev/characters/xiangling/icon.png' }
    ];

    function App() {
      const [records, setRecords] = useState(() => {
        try {
          const saved = localStorage.getItem('genshin_wishes_db_v3');
          return saved ? JSON.parse(saved) : [];
        } catch(e) {
          return [];
        }
      });

      const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());
      const [selectedDay, setSelectedDay] = useState(null);
      const [activeTab, setActiveTab] = useState('calendar');

      // Filters for Stats
      const [filterElement, setFilterElement] = useState('ALL');
      const [filterRarity, setFilterRarity] = useState('ALL');

      // Form States
      const [formName, setFormName] = useState('');
      const [formRarity, setFormRarity] = useState(5);
      const [formElement, setFormElement] = useState('Pyro');
      const [formConstellation, setFormConstellation] = useState(0);
      const [formNotes, setFormNotes] = useState('');
      const [formDay, setFormDay] = useState(1);
      const [formMonth, setFormMonth] = useState(selectedMonth);
      const [formYear, setFormYear] = useState(new Date().getFullYear());
      const [formImage, setFormImage] = useState('');
      const [editingId, setEditingId] = useState(null);

      useEffect(() => {
        localStorage.setItem('genshin_wishes_db_v3', JSON.stringify(records));
      }, [records]);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 3 * 1024 * 1024) {
            alert("La imagen no debe superar los 3MB.");
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => setFormImage(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const resetForm = (day = selectedDay || 1) => {
        setFormName('');
        setFormRarity(5);
        setFormElement('Pyro');
        setFormConstellation(0);
        setFormNotes('');
        setFormDay(day);
        setFormMonth(selectedMonth);
        setFormYear(new Date().getFullYear());
        setFormImage('');
        setEditingId(null);
      };

      const handleSaveRecord = (e) => {
        e.preventDefault();
        if (!formName.trim()) return;

        const imgUrl = formImage || 'https://images.api-genshin.dev/characters/paimon/icon.png';

        if (editingId) {
          setRecords(prev => prev.map(r => r.id === editingId ? {
            ...r,
            name: formName,
            rarity: Number(formRarity),
            element: formElement,
            constellation: Number(formConstellation),
            notes: formNotes,
            day: Number(formDay),
            month: Number(formMonth),
            year: Number(formYear),
            image: imgUrl
          } : r));
        } else {
          const newEntry = {
            id: Date.now().toString(),
            name: formName,
            rarity: Number(formRarity),
            element: formElement,
            constellation: Number(formConstellation),
            notes: formNotes,
            day: Number(formDay),
            month: Number(formMonth),
            year: Number(formYear),
            image: imgUrl
          };
          setRecords(prev => [...prev, newEntry]);
        }

        resetForm(formDay);
      };

      const handleEdit = (rec) => {
        setEditingId(rec.id);
        setFormName(rec.name);
        setFormRarity(rec.rarity);
        setFormElement(rec.element);
        setFormConstellation(rec.constellation || 0);
        setFormNotes(rec.notes || '');
        setFormDay(rec.day);
        setFormMonth(rec.month);
        setFormYear(rec.year);
        setFormImage(rec.image || '');
      };

      const handleDelete = (id) => {
        setRecords(prev => prev.filter(r => r.id !== id));
        if (editingId === id) resetForm();
      };

      const openDayModal = (day) => {
        setSelectedDay(day);
        resetForm(day);
      };

      const getRecordsForDay = (day) => {
        return records.filter(r => r.day === day && r.month === selectedMonth)
                      .sort((a, b) => b.year - a.year);
      };

      // Filtered Records for Stats View
      const filteredRecords = useMemo(() => {
        return records.filter(r => {
          const matchElement = filterElement === 'ALL' || r.element === filterElement;
          const matchRarity = filterRarity === 'ALL' || r.rarity === Number(filterRarity);
          return matchElement && matchRarity;
        }).sort((a, b) => {
          if (b.year !== a.year) return b.year - a.year;
          if (b.month !== a.month) return b.month - a.month;
          return b.day - a.day;
        });
      }, [records, filterElement, filterRarity]);

      const handleExport = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
        const dl = document.createElement('a');
        dl.setAttribute("href", dataStr);
        dl.setAttribute("download", `genshin_wishes_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(dl);
        dl.click();
        dl.remove();
      };

      const handleImport = (e) => {
        const reader = new FileReader();
        if (e.target.files[0]) {
          reader.readAsText(e.target.files[0], "UTF-8");
          reader.onload = (evt) => {
            try {
              const parsed = JSON.parse(evt.target.result);
              if (Array.isArray(parsed)) setRecords(parsed);
            } catch (err) {
              alert("Archivo JSON no válido.");
            }
          };
        }
      };

      return (
        <div className="min-h-screen p-3 sm:p-6 max-w-7xl mx-auto flex flex-col gap-6">
          {/* HEADER */}
          <header className="flex flex-col md:flex-row items-center justify-between gap-4 bg-slate-900/90 p-5 rounded-3xl border border-slate-800 shadow-xl">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-300 p-0.5 shadow-lg shadow-amber-500/20">
                <div className="w-full h-full bg-slate-950 rounded-2xl flex items-center justify-center">
                  <i className="fa-solid fa-wand-magic-sparkles text-amber-400 text-xl animate-pulse"></i>
                </div>
              </div>
              <div>
                <h1 className="text-xl sm:text-2xl font-bold bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-500 bg-clip-text text-transparent font-serif">
                  Genshin Wish Tracker
                </h1>
                <p className="text-xs text-slate-400">Calendario e Histórico de Personajes Conseguidos</p>
              </div>
            </div>

            {/* TAB SELECTOR */}
            <div className="flex items-center bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
              <button 
                onClick={() => setActiveTab('calendar')}
                className={`flex items-center gap-2 px-5 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all ${activeTab === 'calendar' ? 'bg-amber-500 text-slate-950 shadow-lg font-bold' : 'text-slate-400 hover:text-white'}`}
              >
                <i className="fa-solid fa-calendar-days"></i> Calendario
              </button>
              <button 
                onClick={() => setActiveTab('stats')}
                className={`flex items-center gap-2 px-5 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all ${activeTab === 'stats' ? 'bg-amber-500 text-slate-950 shadow-lg font-bold' : 'text-slate-400 hover:text-white'}`}
              >
                <i className="fa-solid fa-chart-pie"></i> Histórico & Stats
              </button>
            </div>

            {/* IMPORT / EXPORT */}
            <div className="flex items-center gap-2">
              <label className="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300 cursor-pointer transition">
                <i className="fa-solid fa-file-import text-amber-400"></i> Importar
                <input type="file" accept=".json" onChange={handleImport} className="hidden" />
              </label>
              <button onClick={handleExport} className="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300 transition">
                <i className="fa-solid fa-file-export text-amber-400"></i> Exportar
              </button>
            </div>
          </header>

          {/* TAB 1: CALENDAR VIEW */}
          {activeTab === 'calendar' && (
            <main className="bg-slate-900/80 border border-slate-800 rounded-3xl p-4 sm:p-6 shadow-2xl flex flex-col gap-6">
              {/* MONTH CONTROLS */}
              <div className="flex flex-col sm:flex-row justify-between items-center gap-4 border-b border-slate-800 pb-4">
                <div className="flex items-center gap-3">
                  <h2 className="text-2xl font-bold font-serif text-slate-100">
                    Mes de <span className="text-amber-400">{MONTHS[selectedMonth]}</span>
                  </h2>
                  <span className="text-xs bg-amber-500/10 text-amber-300 px-3 py-1 rounded-full border border-amber-500/30">
                    Multianual (Todos los años)
                  </span>
                </div>

                <div className="flex items-center gap-2">
                  <button onClick={() => setSelectedMonth(new Date().getMonth())} className="text-xs bg-slate-800 hover:bg-slate-700 text-amber-300 px-3 py-2 rounded-xl border border-slate-700 font-semibold mr-2">
                    Mes Actual
                  </button>
                  <button onClick={() => setSelectedMonth(prev => prev === 0 ? 11 : prev - 1)} className="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
                    <i className="fa-solid fa-chevron-left"></i>
                  </button>
                  <button onClick={() => setSelectedMonth(prev => prev === 11 ? 0 : prev + 1)} className="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
                    <i className="fa-solid fa-chevron-right"></i>
                  </button>
                </div>
              </div>

              {/* GRID OF DAYS (ICONOS MÁS GRANDES: 52px) */}
              <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-3">
                {Array.from({ length: 31 }, (_, i) => i + 1).map(day => {
                  const dayPulls = getRecordsForDay(day);
                  const isCurrentDay = new Date().getDate() === day && new Date().getMonth() === selectedMonth;

                  return (
                    <div
                      key={day}
                      onClick={() => openDayModal(day)}
                      className={`min-h-[135px] p-3 rounded-2xl border transition-all flex flex-col justify-between group relative cursor-pointer bg-slate-950/70 border-slate-800 hover:border-amber-500/60 hover:shadow-lg ${isCurrentDay ? 'ring-2 ring-amber-400 bg-amber-500/5' : ''}`}
                    >
                      <div className="flex justify-between items-center z-10">
                        <span className={`text-sm font-bold ${isCurrentDay ? 'text-amber-400 font-extrabold' : 'text-slate-300'}`}>
                          Día {day}
                        </span>
                        <span className="opacity-0 group-hover:opacity-100 text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/30">
                          + Ver / Añadir
                        </span>
                      </div>

                      {/* CONTENEDOR DE ICONOS GRANDES (52px x 52px) */}
                      <div className="flex flex-wrap gap-2 mt-2 z-10 max-h-[100px] overflow-y-auto">
                        {dayPulls.map(pull => (
                          <div
                            key={pull.id}
                            title={`${pull.name} (${pull.rarity}★) - ${pull.element} (${pull.year})`}
                            className={`w-13 h-13 sm:w-14 sm:h-14 rounded-2xl border-2 overflow-hidden relative shadow-lg flex-shrink-0 transition-transform group-hover:scale-105 ${pull.rarity === 5 ? 'gold-border bg-amber-950/40' : 'purple-border bg-purple-950/40'}`}
                          >
                            <img src={pull.image} alt={pull.name} className="w-full h-full object-cover" />
                            {/* Insignia de Año */}
                            <span className="absolute bottom-0 inset-x-0 bg-slate-950/90 text-[9px] text-amber-300 font-extrabold text-center leading-tight py-0.5 border-t border-slate-800">
                              '{String(pull.year).slice(2)}
                            </span>
                          </div>
                        ))}
                      </div>

                      {dayPulls.some(p => p.rarity === 5) && (
                        <div className="absolute inset-0 bg-gradient-to-tr from-amber-500/10 to-transparent pointer-events-none rounded-2xl" />
                      )}
                    </div>
                  );
                })}
              </div>
            </main>
          )}

          {/* TAB 2: HISTORICAL & FILTERS BY ELEMENT */}
          {activeTab === 'stats' && (
            <main className="flex flex-col gap-6">
              {/* FILTER BAR BY ELEMENT & RARITY */}
              <div className="bg-slate-900/80 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-4">
                <h3 className="text-sm font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2">
                  <i className="fa-solid fa-filter"></i> Filtrar Histórico por Elemento y Rareza
                </h3>
                
                <div className="flex flex-wrap items-center gap-3">
                  {/* ALL ELEMENTS BUTTON */}
                  <button
                    onClick={() => setFilterElement('ALL')}
                    className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all ${filterElement === 'ALL' ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-md' : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'}`}
                  >
                    Todos los Elementos ({records.length})
                  </button>

                  {/* ELEMENT BUTTONS */}
                  {ELEMENTS.map(el => {
                    const count = records.filter(r => r.element === el.name).length;
                    const isActive = filterElement === el.name;
                    return (
                      <button
                        key={el.name}
                        onClick={() => setFilterElement(el.name)}
                        className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold border transition-all ${isActive ? `${el.bg} ${el.color} ${el.border} shadow-md ring-1 ring-amber-400` : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'}`}
                      >
                        <i className={`fa-solid ${el.icon} ${el.color}`}></i>
                        <span>{el.name}</span>
                        <span className="bg-slate-900 px-1.5 py-0.5 rounded-md text-[10px] font-mono text-slate-300">{count}</span>
                      </button>
                    );
                  })}
                </div>

                {/* RARITY FILTERS */}
                <div className="flex items-center gap-3 pt-2 border-t border-slate-800">
                  <span className="text-xs text-slate-400">Rareza:</span>
                  <button
                    onClick={() => setFilterRarity('ALL')}
                    className={`px-3 py-1 rounded-lg text-xs font-bold ${filterRarity === 'ALL' ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-white'}`}
                  >
                    Todas
                  </button>
                  <button
                    onClick={() => setFilterRarity('5')}
                    className={`px-3 py-1 rounded-lg text-xs font-bold ${filterRarity === '5' ? 'bg-amber-500/20 text-amber-300 border border-amber-400/50' : 'text-slate-400 hover:text-amber-300'}`}
                  >
                    ★ 5 Estrellas
                  </button>
                  <button
                    onClick={() => setFilterRarity('4')}
                    className={`px-3 py-1 rounded-lg text-xs font-bold ${filterRarity === '4' ? 'bg-purple-500/20 text-purple-300 border border-purple-400/50' : 'text-slate-400 hover:text-purple-300'}`}
                  >
                    ★ 4 Estrellas
                  </button>
                </div>
              </div>

              {/* LIST OF FILTERED CHARACTERS */}
              <div className="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold font-serif text-slate-100 flex items-center gap-2">
                    <i className="fa-solid fa-list-check text-amber-400"></i>
                    Resultados ({filteredRecords.length})
                  </h3>
                </div>

                {filteredRecords.length === 0 ? (
                  <div className="text-center py-12 text-slate-500">
                    <p className="text-sm">No hay ningún personaje registrado con los filtros seleccionados.</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    {filteredRecords.map(rec => {
                      const elemConfig = ELEMENTS.find(e => e.name === rec.element) || ELEMENTS[0];
                      return (
                        <div
                          key={rec.id}
                          className={`flex items-center justify-between p-3.5 rounded-2xl border bg-slate-950 ${rec.rarity === 5 ? 'border-amber-500/40' : 'border-purple-500/40'}`}
                        >
                          <div className="flex items-center gap-3">
                            <img src={rec.image} alt={rec.name} className={`w-12 h-12 rounded-xl object-cover border-2 ${rec.rarity === 5 ? 'border-amber-400' : 'border-purple-400'}`} />
                            <div>
                              <div className="flex items-center gap-2">
                                <h4 className="font-bold text-slate-100 text-sm">{rec.name}</h4>
                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${rec.rarity === 5 ? 'bg-amber-400/20 text-amber-300' : 'bg-purple-400/20 text-purple-300'}`}>
                                  {rec.rarity}★
                                </span>
                              </div>
                              <p className="text-xs text-slate-400 mt-0.5 flex items-center gap-2">
                                <span className={elemConfig.color}>
                                  <i className={`fa-solid ${elemConfig.icon} mr-1`}></i>{rec.element}
                                </span>
                                <span>•</span>
                                <span>{rec.day} {MONTHS[rec.month]} ({rec.year})</span>
                              </p>
                            </div>
                          </div>
                          <button onClick={() => handleDelete(rec.id)} className="text-slate-500 hover:text-red-400 p-2">
                            <i className="fa-solid fa-trash"></i>
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </main>
          )}

          {/* MODAL DEL DÍA CON SELECTOR DE ELEMENTO PROMINENTE */}
          {selectedDay !== null && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-amber-500/30 w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                
                {/* MODAL HEADER */}
                <div className="bg-slate-800/80 px-6 py-4 border-b border-slate-700/60 flex justify-between items-center">
                  <h3 className="text-lg font-bold font-serif text-slate-100">
                    <i className="fa-solid fa-calendar-day text-amber-400 mr-2"></i>
                    Historial del {selectedDay} de {MONTHS[selectedMonth]}
                  </h3>
                  <button onClick={() => setSelectedDay(null)} className="text-slate-400 hover:text-white">
                    <i className="fa-solid fa-xmark text-xl"></i>
                  </button>
                </div>

                <div className="p-6 overflow-y-auto space-y-6">
                  {/* REGISTROS EXISTENTES DE ESTE DÍA */}
                  {getRecordsForDay(selectedDay).length > 0 && (
                    <div className="space-y-3">
                      <h4 className="text-xs font-semibold uppercase text-slate-400">Obtenidos en este mismo día:</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {getRecordsForDay(selectedDay).map(pull => (
                          <div key={pull.id} className={`p-3 rounded-2xl border flex items-center justify-between bg-slate-950 ${pull.rarity === 5 ? 'border-amber-500/40' : 'border-purple-500/40'}`}>
                            <div className="flex items-center gap-3">
                              <img src={pull.image} className="w-11 h-11 rounded-xl object-cover border border-slate-700" />
                              <div>
                                <p className="font-bold text-sm text-slate-100">{pull.name} <span className="text-xs text-amber-400">({pull.year})</span></p>
                                <p className="text-xs text-slate-400">{pull.rarity}★ • {pull.element}</p>
                              </div>
                            </div>
                            <div className="flex gap-1">
                              <button onClick={() => handleEdit(pull)} className="p-2 text-slate-400 hover:text-amber-300"><i className="fa-solid fa-pen"></i></button>
                              <button onClick={() => handleDelete(pull.id)} className="p-2 text-slate-400 hover:text-red-400"><i className="fa-solid fa-trash"></i></button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* FORMULARIO DE REGISTRO / EDICIÓN */}
                  <form onSubmit={handleSaveRecord} className="space-y-4 pt-4 border-t border-slate-800">
                    <h4 className="text-xs font-bold uppercase tracking-wider text-amber-400">
                      {editingId ? 'Editar Personaje' : 'Añadir Nuevo Personaje'}
                    </h4>

                    {/* SELECCIÓN RÁPIDA DE PLANTILLA */}
                    <div>
                      <label className="block text-xs text-slate-400 mb-1.5">Plantilla Rápida:</label>
                      <div className="flex gap-2 overflow-x-auto pb-2">
                        {PRESET_CHARS.map(c => (
                          <button
                            key={c.name}
                            type="button"
                            onClick={() => {
                              setFormName(c.name);
                              setFormRarity(c.rarity);
                              setFormElement(c.element);
                              setFormImage(c.icon);
                            }}
                            className="flex items-center gap-2 px-3 py-1.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-medium whitespace-nowrap"
                          >
                            <img src={c.icon} className="w-5 h-5 rounded-full object-cover" />
                            <span>{c.name}</span>
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* SELECTOR DE FECHA (DÍA, MES, AÑO) */}
                    <div className="grid grid-cols-3 gap-3 bg-slate-950 p-3 rounded-2xl border border-slate-800">
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">Día</label>
                        <input type="number" min="1" max="31" value={formDay} onChange={e => setFormDay(e.target.value)} className="w-full px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100" />
                      </div>
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">Mes</label>
                        <select value={formMonth} onChange={e => setFormMonth(Number(e.target.value))} className="w-full px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100">
                          {MONTHS.map((m, i) => <option key={i} value={i}>{m}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">Año</label>
                        <select value={formYear} onChange={e => setFormYear(Number(e.target.value))} className="w-full px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-amber-400 font-bold">
                          {[2020, 2021, 2022, 2023, 2024, 2025, 2026, 2027].map(y => <option key={y} value={y}>{y}</option>)}
                        </select>
                      </div>
                    </div>

                    {/* NOMBRE Y RAREZA */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">Nombre del Personaje *</label>
                        <input type="text" required placeholder="Ej: Furina" value={formName} onChange={e => setFormName(e.target.value)} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-amber-500" />
                      </div>
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">Rareza</label>
                        <select value={formRarity} onChange={e => setFormRarity(Number(e.target.value))} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                          <option value={5}>5 Estrellas (5★)</option>
                          <option value={4}>4 Estrellas (4★)</option>
                        </select>
                      </div>
                    </div>

                    {/* SELECTOR DE ELEMENTO DESTACADO */}
                    <div>
                      <label className="block text-xs font-bold text-amber-300 mb-2">Elemento del Personaje *</label>
                      <div className="grid grid-cols-4 sm:grid-cols-7 gap-2">
                        {ELEMENTS.map(el => {
                          const isSel = formElement === el.name;
                          return (
                            <button
                              key={el.name}
                              type="button"
                              onClick={() => setFormElement(el.name)}
                              className={`flex flex-col items-center justify-center p-2 rounded-xl border transition-all ${isSel ? `${el.bg} ${el.border} ${el.color} ring-2 ring-amber-400 scale-105 font-bold` : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'}`}
                            >
                              <i className={`fa-solid ${el.icon} text-lg mb-1 ${el.color}`}></i>
                              <span className="text-[10px]">{el.name}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {/* IMAGEN Y SUBIDA */}
                    <div className="space-y-2">
                      <label className="block text-xs text-slate-400">Imagen PNG del Personaje</label>
                      <div className="flex items-center gap-4">
                        <div className="w-14 h-14 bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden flex items-center justify-center flex-shrink-0">
                          {formImage ? <img src={formImage} className="w-full h-full object-cover" /> : <i className="fa-solid fa-image text-slate-600 text-xl"></i>}
                        </div>
                        <div className="flex-1 space-y-2">
                          <label className="flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs text-slate-200 cursor-pointer transition">
                            <i className="fa-solid fa-upload text-amber-400"></i> Subir Imagen desde mi PC (PNG/JPG)
                            <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                          </label>
                        </div>
                      </div>
                    </div>

                    {/* BOTONES */}
                    <div className="flex justify-end gap-3 pt-4">
                      {editingId && (
                        <button type="button" onClick={() => resetForm(selectedDay)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">
                          Cancelar Edición
                        </button>
                      )}
                      <button type="submit" className="px-6 py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold rounded-xl text-xs shadow-lg shadow-amber-500/20 transition">
                        {editingId ? 'Guardar Cambios' : 'Registrar Personaje'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
